<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Verify Registration | Game Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary-orange: #e65100;
            --primary-dark: #bf360c;
            --primary-light: #ff6d00;
            --bg-gradient: linear-gradient(135deg, #bf360c 0%, #e65100 50%, #ff6d00 100%);
            --card-shadow: 0 15px 35px rgba(191, 54, 12, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .otp-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .otp-container:hover {
            transform: translateY(-5px);
        }

        .icon-header {
            width: 70px;
            height: 70px;
            background: rgba(230, 81, 0, 0.1);
            color: var(--primary-orange);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 25px;
        }

        .otp-container h2 {
            margin-bottom: 12px;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .otp-container p {
            margin-bottom: 15px;
            color: #6c757d;
            font-size: 15px;
            line-height: 1.6;
        }

        .otp-input-group {
            margin-bottom: 25px;
        }

        .otp-input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #fceae3;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: var(--primary-orange);
            box-sizing: border-box;
            background: #fffafa;
        }

        .otp-input:focus {
            border-color: var(--primary-orange);
            outline: none;
            box-shadow: 0 0 0 4px rgba(230, 81, 0, 0.1);
            background: #fff;
        }

        .otp-input::placeholder {
            letter-spacing: normal;
            font-size: 16px;
            font-weight: 400;
            color: #adb5bd;
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary-orange), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(191, 54, 12, 0.2);
        }

        .verify-btn:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-orange));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(191, 54, 12, 0.3);
        }

        .timer-container {
            margin-top: 20px;
            padding: 12px;
            background: #fff8f5;
            border-radius: 10px;
            display: inline-block;
            min-width: 150px;
        }

        .timer {
            font-size: 14px;
            color: #495057;
        }

        #timer {
            color: var(--primary-orange);
            font-weight: 700;
            margin-left: 5px;
        }

        .error-msg {
            color: #d84315;
            margin-top: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: #fff0f0;
            padding: 8px;
            border-radius: 8px;
        }

        .footer-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #fceae3;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            color: #6d4c41;
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .back-btn i {
            margin-right: 8px;
        }

        .back-btn:hover {
            color: var(--primary-orange);
        }
    </style>
</head>

<body>

    <div class="otp-container">
        <div class="icon-header">
            <i class="fa-solid fa-gamepad"></i>
        </div>
        <h2>ยืนยัน Email</h2>
        <p>กรอกรหัส OTP 6 หลักที่ส่งไปยัง Email ของคุณ<br>เพื่อยืนยันตัวตนก่อนสมัครสมาชิก</p>
        <p class="mb-4">รหัสจะหมดอายุใน 5 นาที</p>

        <form action="/verify-register-otp" method="post">
            <div class="otp-input-group">
                <input type="text" name="otp" class="otp-input" placeholder="_ _ _ _ _ _"
                       maxlength="6" inputmode="numeric" required autofocus autocomplete="off" />
            </div>
            <button type="submit" class="verify-btn">ยืนยัน OTP</button>
        </form>

        <div class="timer-container">
            <span class="timer">
                <i class="fa-regular fa-clock me-1"></i> หมดอายุใน <span id="timer">05:00</span>
            </span>
        </div>

        <div th:if="${error}" class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">Error message</span>
        </div>

        <div class="footer-links">
            <a href="/register" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> ย้อนกลับ
            </a>
        </div>
    </div>

    <script>
        let timeLeft = 300;
        const timerEl = document.getElementById("timer");

        const interval = setInterval(() => {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerEl.textContent = String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
            timeLeft--;

            if (timeLeft < 0) {
                clearInterval(interval);
                window.location.href = "/register?expired=true";
            }
        }, 1000);
    </script>

</body>

</html>
